# Publishes the simulator to GitHub Pages on every push to main.
# The site is static (index.html + js/ + css/), so there is no build step:
# the whole repository is uploaded as the Pages artifact.
# One-time prerequisite: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check the JavaScript (syntax + question bank)
        run: |
          for f in js/data/*.js js/sim/*.js js/app.js; do node --check "$f"; done
          node -e "
            global.window = global;
            for (const f of ['js/data/syllabus.js','js/data/questions-ib-tshoot-dc.js','js/data/questions-spx-k8s-auto.js']) require('./' + f);
            console.log('questions:', window.NCP_QUESTIONS.length);
            if (window.NCP_QUESTIONS.length < 100) process.exit(1);
          "
      # Pages must be switched on once by a repo admin:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # (the default GITHUB_TOKEN is not allowed to create the Pages site itself).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
